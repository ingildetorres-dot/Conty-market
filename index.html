<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conty Market POS</title>
<meta name="theme-color" content="#0174D1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Conty Market POS — tokens de marca ===== */
:root{
  --ink:#0E2B4C; --ink2:#3E5A7A; --ink3:#7D93AC;
  --bg:#F1F6FC; --card:#FFFFFF; --line:#D3E2F1; --line2:#EBF2F9;
  --azul:#0174D1; --azul-d:#0051A2; --azul-l:#E3F0FC;
  --rosa:#E93276; --rosa-d:#B81255; --rosa-l:#FDE4EE;
  --amarillo:#FFC405; --amarillo-t:#7A5C00;
  --rojo:#D92B2B; --rojo-l:#FBE6E6;
  --r:6px; --r2:10px;
  --disp:'Archivo Black','Arial Black',system-ui,sans-serif;
  --body:'Archivo', system-ui, -apple-system, sans-serif;
  --sh:0 2px 0 rgba(14,43,76,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.4; overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--rosa); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--azul)}

/* ===== Tipografía de cartel ===== */
.disp{font-family:var(--disp);font-weight:400;letter-spacing:-.01em;text-transform:uppercase}
.eyebrow{
  font-family:var(--disp); font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink3);
}

/* ===== Shell ===== */
.top{
  position:sticky;top:0;z-index:40; background:var(--azul); color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  display:flex;align-items:center;gap:10px;
}
.top .mark{
  font-family:var(--disp);font-size:17px;letter-spacing:.02em;line-height:1;
}
.top .mark b{color:var(--amarillo);font-weight:400}
.top .mark i{color:#fff;font-style:normal}
.top .sede{font-size:11px;color:#C3E0F7;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.chip{
  font-size:11px;font-weight:600;padding:4px 8px;border-radius:99px;
  background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;gap:5px;
  letter-spacing:.03em;
}
.chip.on{background:#0B9A4E;color:#fff}
.chip.warn{background:var(--amarillo);color:var(--amarillo-t)}
.chip.off{background:rgba(255,255,255,.14);color:#D5EAF9}
.dot{width:6px;height:6px;border-radius:99px;background:currentColor;display:inline-block}

main{padding:12px 12px 200px; max-width:820px; margin:0 auto}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ===== Nav inferior ===== */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.02em;
  border-top:3px solid transparent;
}
.nav button svg{width:21px;height:21px;stroke-width:1.9}
.nav button[aria-current="true"]{color:var(--azul);border-top-color:var(--azul)}

/* ===== Cards / listas ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.tight{padding:0;overflow:hidden}
.card h3{font-size:14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack>*+*{margin-top:8px}
.muted{color:var(--ink3);font-size:13px}
.tiny{font-size:11.5px;color:var(--ink3)}
hr.sep{border:none;border-top:1px solid var(--line2);margin:10px 0}

.item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--line2);
}
.item:last-child{border-bottom:none}
.item .g{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:11.5px;color:var(--ink3)}
.item .v{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}

/* ===== Botones ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 14px;border-radius:var(--r);font-weight:700;font-size:15px;
  background:var(--card);border:1.5px solid var(--azul);color:var(--azul-d);
  min-height:46px;
}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.ama{background:var(--amarillo);border-color:var(--amarillo);color:var(--amarillo-t)}
.btn.acc{background:var(--rosa);border-color:var(--rosa);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dan{background:var(--card);border-color:var(--rojo);color:var(--rojo)}
.btn.ghost{border-color:var(--line);color:var(--ink2);font-weight:600}
.btn.sm{padding:8px 10px;min-height:36px;font-size:13px}
.btn.xl{min-height:56px;font-size:17px;width:100%}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;stroke-width:2}

/* ===== Inputs ===== */
label.f{display:block;margin-bottom:8px}
label.f>span{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:4px;letter-spacing:.02em}
input[type=text],input[type=number],input[type=tel],input[type=password],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--card);color:var(--ink);
}
input:focus,select:focus,textarea:focus{border-color:var(--azul);outline:none}
textarea{min-height:70px;resize:vertical}
.inline-check{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
.inline-check input{width:20px;height:20px;accent-color:var(--azul)}

/* ===== Escáner (barra de captura) ===== */
.scanbar{
  background:var(--card);border:2px solid var(--azul);border-radius:var(--r);
  display:flex;align-items:center;gap:0;overflow:hidden;margin-bottom:10px;
}
.scanbar input{border:none;border-radius:0;font-weight:600;font-size:17px}
.scanbar input:focus{border:none}
.scanbar .b{
  padding:0 12px;align-self:stretch;display:flex;align-items:center;
  border-left:1.5px solid var(--line);color:var(--ink2)
}
.scanbar .b svg{width:22px;height:22px;stroke-width:1.9}
.scanbar.beep{animation:beep .35s ease}
@keyframes beep{
  0%{box-shadow:0 0 0 0 rgba(233,50,118,.6)}
  100%{box-shadow:0 0 0 14px rgba(233,50,118,0)}
}

/* ===== Tirilla de cobro (elemento firma) ===== */
.tirilla{
  position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:45;
  background:var(--ink);color:#fff;padding:12px 14px 14px;
}
.tirilla::before{
  content:"";position:absolute;top:-9px;left:0;right:0;height:9px;
  background-image:
    linear-gradient(45deg,transparent 50%,var(--ink) 50%),
    linear-gradient(-45deg,transparent 50%,var(--ink) 50%);
  background-size:14px 9px;background-repeat:repeat-x;background-position:bottom;
}
.tirilla .lbl{font-family:var(--disp);font-size:10.5px;letter-spacing:.14em;color:#9EC5E6}
.tirilla .tot{
  font-family:var(--disp);font-size:33px;line-height:.95;letter-spacing:0;
  font-variant-numeric:tabular-nums;
}
.tirilla .tot small{font-size:20px;color:var(--amarillo);margin-right:2px}
.tirilla .meta{font-size:11.5px;color:#B7D5EE;margin-top:2px}

/* ===== Teclado numérico ===== */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:15px 0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;
}
.keys button.act{background:var(--ink);color:#fff;border-color:var(--ink);font-size:15px}
.keys button:active{background:var(--azul-l)}

/* ===== Modales ===== */
.sheetwrap{
  position:fixed;inset:0;z-index:80;background:rgba(23,21,15,.55);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:12px 12px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  animation:up .2s ease;
}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sheet .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet .head h2{font-family:var(--disp);font-size:19px;text-transform:uppercase;letter-spacing:.01em}
.x{width:34px;height:34px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}

/* ===== Toast ===== */
#toasts{position:fixed;left:0;right:0;bottom:calc(140px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{
  background:var(--ink);color:#fff;padding:10px 14px;border-radius:99px;
  font-size:13.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);
  max-width:88%;animation:fade .15s ease;
}
.toast.ok{background:#0B9A4E}
.toast.err{background:var(--rojo)}
.toast.warn{background:var(--amarillo);color:var(--amarillo-t)}

/* ===== Badges / estados ===== */
.bad{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
.bad.v{background:var(--azul-l);color:var(--azul-d)}
.bad.r{background:var(--rojo-l);color:var(--rojo)}
.bad.n{background:var(--rosa-l);color:var(--rosa-d)}
.bad.g{background:var(--line2);color:var(--ink2)}
.kg{background:var(--amarillo);color:var(--amarillo-t)}

/* ===== Fila de categorías (deslizable) ===== */
.cats{
  display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
}
.cats::-webkit-scrollbar{height:3px}
.cats::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.cats .btn{flex:none;white-space:nowrap;scroll-snap-align:start}

/* ===== Fotos de producto ===== */
.th{width:42px;height:42px;border-radius:var(--r);object-fit:cover;background:var(--azul-l);flex:none;display:block}
.th.ph{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;color:var(--azul)}
.thb{width:92px;height:92px;border-radius:var(--r2);object-fit:cover;background:var(--azul-l);flex:none;display:block;border:1px solid var(--line)}
.thb.ph{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:34px;color:var(--azul)}
.thf{width:100%;height:40px;object-fit:cover;border-radius:4px;background:var(--azul-l);display:block;margin-bottom:3px}
.thf.ph{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;color:var(--azul)}
.fotolbl{cursor:pointer}

/* ===== Empty states ===== */
.empty{text-align:center;padding:34px 18px;color:var(--ink3)}
.empty .disp{font-size:17px;color:var(--ink2);margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:13.5px}

/* ===== Métricas ===== */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px}
.kpi .k{font-family:var(--disp);font-size:21px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-top:3px}
.kpi.g .k{color:var(--azul)}
.kpi.o .k{color:var(--rosa)}
.kpi.r .k{color:var(--rojo)}

/* ===== Barras de reporte ===== */
.bar{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--rosa)}

/* ===== Login / setup ===== */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;max-width:460px;margin:0 auto}
.gate .logo{font-family:var(--disp);font-size:32px;line-height:.95;text-transform:uppercase;margin-bottom:4px}
.gate .logo b{color:var(--rosa);font-weight:400}
.gate .mas{width:104px;height:104px;display:block;margin:0 auto 10px}
.gate .cover{width:100%;border-radius:var(--r2);border:1px solid var(--line);display:block}
.gate .sub{color:var(--ink3);font-size:13px;margin-bottom:22px;letter-spacing:.02em}
.pinbox{display:flex;gap:8px;justify-content:center;margin:14px 0 18px}
.pinbox i{width:16px;height:16px;border-radius:99px;border:2px solid var(--azul);display:block}
.pinbox i.on{background:var(--rosa);border-color:var(--rosa)}
.who{display:grid;gap:8px;margin-bottom:16px}
.who button{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:12px;text-align:left;font-weight:600;display:flex;justify-content:space-between;align-items:center
}
.who button.sel{border-color:var(--rosa);background:var(--rosa-l)}

/* ===== Cámara ===== */
#camwrap{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
#camvid{flex:1;width:100%;object-fit:cover}
.camui{padding:12px 14px calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:#fff}
.reticle{position:absolute;top:50%;left:8%;right:8%;height:96px;transform:translateY(-50%);border:3px solid var(--amarillo);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}

/* ===== Impresión de tirilla ===== */
#printarea{display:none}
@media print{
  body>*{display:none !important}
  #printarea{display:block !important;font-family:ui-monospace,'Courier New',monospace;font-size:12px;color:#000;width:100%}
  #printarea .c{text-align:center}
  #printarea table{width:100%;border-collapse:collapse}
  #printarea td{padding:1px 0;vertical-align:top}
  #printarea .d{border-top:1px dashed #000;margin:4px 0}
  #printarea .big{font-size:15px;font-weight:bold}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="printarea"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
